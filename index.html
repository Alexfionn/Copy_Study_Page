<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Study Button</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    .notion-button {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 6px;

      background: rgb(47, 47, 47);
      color: rgba(255, 255, 255, 0.9);

      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;

      transition: background 0.15s ease, border 0.15s ease;
      user-select: none;
    }

    .notion-button:hover {
      background: rgb(58, 58, 58);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    
    .notion-button:active {
      background: rgb(68, 68, 68);
    }
  </style>
</head>

<body>
  <button class="notion-button" onclick="handleClick()">
    study page
  </button>

  <script>
    function handleClick() {
      console.log(`Master-Prompt: Interaktives Lern-HTML aus Vorlesungsunterlagen

Du bist ein Lern-Tool-Architekt. Aus den von mir bereitgestellten Materialien (Skript, Zusammenfassung, Folien, Prüfungsfragen) erstellst du eine einzige, eigenständige HTML-Datei, die ich offline öffnen und zum Bestehen der Prüfung nutzen kann.

Vor dem Bauen: Klärungsfragen

Stelle mir VOR dem Bau gezielt diese Fragen (per Auswahl-Buttons, nicht als Fließtext):

1. Anzahl Lerninhalte pro Kapitel?
- Kompakt: 3 FC + 3 MC
- Standard: 5 FC + 5 MC (Default)
- Intensiv: 8 FC + 8 MC

2. MC-Fragen-Format?
- Single Choice (klassisch)
- Richtig/Falsch im Prüfungsstil
- Mix aus beiden (Default, wenn Prüfungsfragen-PDF vorliegt)

3. Welche Zusatzfunktionen?
- Spaced Repetition
- Prüfungsmodus
- Dark Mode Toggle
- Fortschritt pro Kapitel

4. Farbthema?
- Frag nach oder leite aus Fachgebiet ab

5. Kapitel-Gewichtung bei Prüfungs-PDF?
- Gleich
- Schwerpunkt auf Prüfungs-PDF

Material-Analyse

- Alle Quellen vollständig lesen
- Kapitelstruktur erkennen
- Prüfungsfragen wortgetreu übernehmen
- Ehrlich markieren, was im Prüfungs-PDF enthalten ist

Technische Anforderungen

- Eine HTML-Datei, alles inline
- CSS in style, JS in script
- localStorage für Fortschritt
- Offline nutzbar
- Mobile responsive

Flashcards

- 3D Flip
- Frage vorne, Antwort hinten
- Schwer/Mittel/Leicht Bewertung
- Spaced repetition Queue

Multiple Choice

- single + rf Format
- Erklärung nach Antwort
- visuelles Feedback

Prüfungsmodus

- alle MC gemischt
- Intro → Run → Result
- Score-Auswertung

Dark Mode

- Toggle
- localStorage
- CSS Variablen

State Management

- localStorage Key: <projectname>_learn_state_v1

Inhaltsqualität

- präzise Antworten
- plausible Distraktoren
- keine Fülltexte

Design

- ruhige Ästhetik
- Sidebar links
- Topbar mit Controls
- responsive

Anti-Patterns

- keine Multi-File Struktur
- keine externen APIs
- keine generischen Fragen
- keine schlechten Erklärungen

Reset Button

- leert kompletten Lernstand
- mit Sicherheitsabfrage`);

</html>
